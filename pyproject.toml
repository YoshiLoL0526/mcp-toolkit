[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-toolkit"
version = "0.1.0"
description = "Servidor MCP con herramientas de propósito general para agentes de IA"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["mcp", "ai", "agents", "tools"]
dependencies = [
    "fastmcp>=2.0.0",
    "playwright>=1.49.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "httpx>=0.28.0",
    "trafilatura>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/YoshiLoL0526/mcp-toolkit"
Repository = "https://github.com/YoshiLoL0526/mcp-toolkit"
Issues = "https://github.com/YoshiLoL0526/mcp-toolkit/issues"

[project.scripts]
mcp-toolkit = "mcp_toolkit.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_toolkit"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
